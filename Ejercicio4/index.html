<body>
    <div class="formulario">
        <h2>Acceso y edad</h2>
        <p>En esta web se queda registrado el nombre y la edad del usuario.Puedes añadir nuevos usuarios y tambien
            puedes ver la lista de todos los usuarios registrados con su edad.</p>
        <form method="post" action="formulario.js" id="formulario">
            <label for="nombre">Introduce tu nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
            <label for="edad">Introduce tu edad:</label>
            <input type="number" id="edad" name="edad" placeholder="Edad" required>
            <button type="submit">Enviar</button>
        </form>
    </div>

    <div class="consultar">
        <p>Puedes consultar quien se ha registrado en esta web</p>
        <button type="button" id="btnConsultar">Consultar</button>
    </div>

    <div id="listaUsuarios"></div>

    <script src="js/formulario.js"></script>
</body>
    
</html>
